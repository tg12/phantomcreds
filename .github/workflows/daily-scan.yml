name: Daily Phantomcreds Scan

concurrency:
  group: phantomcreds-scan-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 6,7 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug logging"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Check London run window
        id: schedule_gate
        run: |
          current_hour=$(TZ=Europe/London date +%H)
          echo "current_hour=${current_hour}" >> "${GITHUB_OUTPUT}"
          if [ "${current_hour}" != "07" ]; then
            echo "Skipping scheduled run outside 07:00 Europe/London."
          else
            echo "Proceeding with 07:00 Europe/London run."
          fi
          # exit 0 here does NOT stop subsequent steps — the if: conditions on
          # each downstream step read current_hour from GITHUB_OUTPUT and gate
          # execution there. This step only populates the output variable.

      - name: Stop early outside London run window
        if: github.event_name == 'schedule' && steps.schedule_gate.outputs.current_hour != '07'
        run: |
          echo "Outside 07:00 Europe/London window — skipping scan."
          exit 0

      - name: Set up Python 3.14
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.current_hour == '07'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.current_hour == '07'
        run: pip install -e .[dev]

      - name: Run tests
        if: github.event_name == 'workflow_dispatch'
        run: pytest

      - name: Run scan
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.current_hour == '07'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python -m phantomcreds.main

      - name: Commit results
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.current_hour == '07'
        run: |
          git config user.name "phantomcreds[bot]"
          git config user.email "phantomcreds[bot]@users.noreply.github.com"
          git add data/ README.md
          git diff --staged --quiet || (
            git commit -m "scan: $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin main
          )
