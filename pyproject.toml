[project]
name = "phantomcreds"
version = "0.1.0"
description = "Automated detection of credential-harvesting and unsafe credential-storage repos on GitHub"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34",
    "tenacity>=9.1",
    "colorlog>=6.12",
]

[project.scripts]
phantomcreds = "phantomcreds.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "black>=26.0",
    "ruff>=0.16",
    "mypy>=2.3",
    "pylint>=4.0",
    "types-requests>=2.33",
    "vulture>=2.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py314"]
# Ruff's E501 is disabled and Black owns wrapping; keep the two limits identical here so
# formatted output never trips the linter.

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "C90", "RUF", "PT"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/phantomcreds --cov-report=term-missing"

[tool.pylint.'MESSAGES CONTROL']
disable = ["duplicate-code"]
